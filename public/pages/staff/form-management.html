<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forms Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    button { padding: 6px 10px; cursor: pointer; }
    #modalOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    }
    #modal {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Forms Dashboard</h1>

  <table id="formsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Form Type</th>
        <th>Sent</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="modalOverlay" onclick="closeModal(event)">
    <div id="modal"></div>
  </div>

  <script>
    async function fetchForms() {
      const res = await fetch('/api/forms');
      const data = await res.json();
      const tbody = document.querySelector('#formsTable tbody');
      tbody.innerHTML = '';

      data.forEach(row => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td>${row.name || ''}</td>
          <td>${row.form_type}</td>
          <td>${row.sent ? 'Yes' : 'No'}</td>
          <td><button onclick='viewJson(${JSON.stringify(row.data)})'>View</button></td>
        `;

        tbody.appendChild(tr);
      });
    }

    function viewJson(json) {
      const modal = document.getElementById('modal');
      modal.textContent = JSON.stringify(json, null, 2);
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        document.getElementById('modalOverlay').style.display = 'none';
      }
    }

    fetchForms();
  </script>
</body>
</html>
