<h3>Clients</h3>
<table id="clientsTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Manage Forms</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Modal -->
<div id="formsModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>Client Forms</h3>

    <table id="formsTable">
      <thead>
        <tr>
          <th>Form Name</th>
          <th>Informed Consent</th>
          <th>Medical History</th>
          <th>Privacy Practices Notices</th>
          <th>E-Sign Consent</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="sentUrlContainer" style="margin-top: 20px; display: none">
      <label>Form URL:</label>
      <input
        type="text"
        id="sentUrl"
        readonly
        style="width: 100%; padding: 8px; margin-top: 5px"
      />
    </div>
    <!-- New Send Forms button -->
    <button id="sendFormsBtn" style="margin-top: 15px">Send Forms</button>
  </div>
</div>

<script>
  const clientsTableBody = document.querySelector("#clientsTable tbody");
  const formsTableBody = document.querySelector("#formsTable tbody");
  const modal = document.getElementById("formsModal");
  const closeBtn = modal.querySelector(".close");
  const sendFormsBtn = document.getElementById("sendFormsBtn");

  let currentForms = []; // store currently loaded forms
  let currentClientId = null; // track which client is open

  // Open/close modal
  closeBtn.onclick = () => (modal.style.display = "none");
  window.onclick = (e) => {
    if (e.target === modal) modal.style.display = "none";
  };

  // Load all clients
  function loadClients() {
    fetch("/clients")
      .then((res) => res.json())
      .then((clients) => {
        clientsTableBody.innerHTML = "";
        clients.forEach((c) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${c.id}</td>
            <td>${c.first_name} ${c.last_name}</td>
            <td>${c.email}</td>
            <td>${c.phone}</td>
            <td><button class="manage-btn" data-id="${c.id}">⋯</button></td>
          `;
          clientsTableBody.appendChild(tr);
        });

        // Add event listeners for manage buttons
        document.querySelectorAll(".manage-btn").forEach((btn) => {
          btn.addEventListener("click", () => openFormsModal(btn.dataset.id));
        });
      });
  }

  // Open modal and populate with client’s forms
  function openFormsModal(clientId) {
    formsTableBody.innerHTML = "";
    modal.style.display = "block";
    currentClientId = clientId;
    currentForms = [];

    fetch(`/forms/${clientId}`)
      .then((res) => res.json())
      .then((forms) => {
        if (forms.length === 0) {
          // create a default form if none exist
          fetch(`/forms/${clientId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ names: ["default"] }),
          }).then(() => openFormsModal(clientId));
          return;
        }

        currentForms = forms; // store forms for send button
        forms.forEach((f) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${f.name || "Form"}</td>
            <td><input type="checkbox" data-field="informed_consent" ${
              f.informed_consent ? "checked" : ""
            }></td>
            <td><input type="checkbox" data-field="medical_history" ${
              f.medical_history ? "checked" : ""
            }></td>
            <td><input type="checkbox" data-field="privacy_practices_notices" ${
              f.privacy_practices_notices ? "checked" : ""
            }></td>
            <td><input type="checkbox" data-field="e_sign_consent" ${
              f.e_sign_consent ? "checked" : ""
            }></td>
          `;

          tr.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
            cb.addEventListener("change", () => {
              const field = cb.dataset.field;
              const value = cb.checked ? 1 : 0;
              fetch(`/forms/update/${f.token}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ field, value }),
              });
            });
          });

          formsTableBody.appendChild(tr);
        });
      });
  }

  // Send Forms button logic
// Send Forms button logic
sendFormsBtn.addEventListener("click", () => {
  if (!currentForms.length) {
    alert("No forms available for this client.");
    return;
  }

  // Assuming first form's token for demo (adjust if multiple)
  const token = currentForms[0].token;
  const customURL = `http://localhost:3000/form-wizard/${token}`;

  // Render URL on screen
  const container = document.getElementById("sentUrlContainer");
  const input = document.getElementById("sentUrl");
  input.value = customURL;
  container.style.display = "block";

  // Optionally select the URL for easy copying
  input.select();
  input.setSelectionRange(0, 99999); // for mobile devices

  console.log(customURL);
});


  loadClients();
</script>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  h3 {
    margin-top: 40px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 10px;
  }
  th,
  td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #f4f4f4;
  }
  button.manage-btn {
    border: none;
    background: none;
    font-size: 20px;
    cursor: pointer;
  }
  button.manage-btn:hover {
    color: #007bff;
  }

  /* Modal styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.5);
  }
  .modal-content {
    background: #fff;
    margin: 5% auto;
    padding: 20px;
    width: 80%;
    border-radius: 8px;
    position: relative;
  }
  .modal .close {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 24px;
    cursor: pointer;
  }
  #sendFormsBtn {
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
  }
  #sendFormsBtn:hover {
    background-color: #0056b3;
  }
</style>
