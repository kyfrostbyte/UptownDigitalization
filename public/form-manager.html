<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Form Manager</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  .container { padding: 20px; }
  input[type="text"] { padding: 6px; width: 200px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { cursor: pointer; background-color: #007bff; color: #fff; }
  button { padding: 6px 12px; cursor: pointer; border: none; background-color: #007bff; color: #fff; border-radius: 3px; }
  button:hover { background-color: #0056b3; }
  /* Modal styles */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  .modal-content { background: #fff; padding: 20px; width: 80%; max-width: 800px; border-radius: 5px; max-height: 90%; overflow-y: auto; position: relative; }
  .modal-close { position: absolute; top: 10px; right: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
  .modal-nav { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  .modal-nav a { padding: 6px 12px; border: 1px solid #007bff; border-radius: 3px; text-decoration: none; color: #007bff; }
  .modal-nav a.active, .modal-nav a:hover { background: #007bff; color: #fff; }
  table.form-data { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.form-data td { border: 1px solid #ddd; padding: 6px; }
  table.form-data tr:nth-child(even) { background-color: #f9f9f9; }
  .form-display {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.form-field {
  display: flex;
  gap: 10px;
  padding: 8px 12px;
  background: #f9f9f9;
  border-radius: 6px;
  align-items: center;
}

.form-label {
  font-weight: 600;
  width: 150px;
}

.form-value {
  flex: 1;
}
</style>
</head>
<body>
<div class="container">
  <h2>Client Form Manager</h2>
  <input type="text" id="searchInput" placeholder="Search clients...">
  <table id="clientsTable">
    <thead>
      <tr>
        <th data-key="id">ID</th>
        <th data-key="first_name">First Name</th>
        <th data-key="last_name">Last Name</th>
        <th data-key="email">Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal" id="formModal">
  <div class="modal-content">
    <span class="modal-close" id="modalClose">&times;</span>
    <h3 id="modalClientName"></h3>
    <div class="modal-nav" id="modalFormNav"></div>
    <div id="modalFormData"></div>
  </div>
</div>

<script>
let clients = [];
let currentSort = { key: null, asc: true };

// Fetch clients and render table
function loadClients() {
  fetch('/clients')
    .then(res => res.json())
    .then(data => {
      clients = data;
      renderClientsTable(clients);
    });
}

function renderClientsTable(list) {
  const tbody = document.querySelector('#clientsTable tbody');
  tbody.innerHTML = '';
  list.forEach(client => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${client.id}</td>
      <td>${client.first_name}</td>
      <td>${client.last_name}</td>
      <td>${client.email}</td>
      <td><button onclick="openClientModal(${client.id}, '${client.first_name} ${client.last_name}')">...</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  const filtered = clients.filter(c =>
    c.first_name.toLowerCase().includes(term) ||
    c.last_name.toLowerCase().includes(term) ||
    c.email.toLowerCase().includes(term)
  );
  renderClientsTable(filtered);
});

// Sort
document.querySelectorAll('#clientsTable th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    currentSort.asc = (currentSort.key === key) ? !currentSort.asc : true;
    currentSort.key = key;
    const sorted = [...clients].sort((a,b) => {
      if(a[key] < b[key]) return currentSort.asc ? -1 : 1;
      if(a[key] > b[key]) return currentSort.asc ? 1 : -1;
      return 0;
    });
    renderClientsTable(sorted);
  });
});

// Modal
const modal = document.getElementById('formModal');
const modalClose = document.getElementById('modalClose');
const modalFormNav = document.getElementById('modalFormNav');
const modalFormData = document.getElementById('modalFormData');
const modalClientName = document.getElementById('modalClientName');

modalClose.addEventListener('click', () => {
  modal.style.display = 'none';
  modalFormNav.innerHTML = '';
  modalFormData.innerHTML = '';
});

function openClientModal(clientId, clientName) {
  console.log('Fetching forms for client ID:', clientId);
  modal.style.display = 'flex';
  modalClientName.textContent = `Forms for ${clientName}`;
  modalFormData.innerHTML = '<p>Loading forms...</p>';
  
  fetch(`/client-forms/${clientId}`)
    .then(res => res.json())
    .then(forms => {
      if(!forms.length) {
        modalFormNav.innerHTML = '';
        modalFormData.innerHTML = '<p>No forms found for this client.</p>';
        return;
      }
      modalFormNav.innerHTML = '';
      forms.forEach((f, idx) => {
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = f.form_type;
        if(idx === 0) link.classList.add('active');
        link.addEventListener('click', e => {
          e.preventDefault();
          document.querySelectorAll('.modal-nav a').forEach(a => a.classList.remove('active'));
          link.classList.add('active');
          renderFormData(f);
        });
        modalFormNav.appendChild(link);
      });
      renderFormData(forms[0]); // load first form
    });
}

function renderFormData(form) {
  try {
    const jsonData = JSON.parse(form.data);
    let html = `<div class="form-display">`;
    for (const key in jsonData) {
      html += `
        <div class="form-field">
          <span class="form-label">${capitalize(key)}</span>
          <span class="form-value">${jsonData[key]}</span>
        </div>
      `;
    }
    html += `</div>`;
    modalFormData.innerHTML = html;
  } catch(err) {
    modalFormData.innerHTML = `<pre>${form.data}</pre>`;
  }
}

// Helper function to capitalize field names
function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1).replace(/_/g, ' ');
}

// Close modal on outside click
window.addEventListener('click', e => {
  if(e.target === modal) {
    modal.style.display = 'none';
    modalFormNav.innerHTML = '';
    modalFormData.innerHTML = '';
  }
});

loadClients();
</script>
</body>
</html>
