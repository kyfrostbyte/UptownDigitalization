<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Wizard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        margin: 0;
      }

      .sidebar {
        width: 250px;
        background-color: #f4f4f4;
        border-right: 1px solid #ddd;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px; /* add spacing between items */
        overflow-y: auto; /* scroll if too many items */
      }

      .sidebar h3 {
        margin-bottom: 20px;
        text-align: center;
      }

      .sidebar a {
        display: block; /* make sure each link is block-level */
        padding: 10px 15px;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
        text-decoration: none;
        color: #333;
        text-align: center;
        transition: background 0.2s;
        white-space: nowrap; /* prevent text wrapping if needed */
      }

      .sidebar a.active,
      .sidebar a:hover {
        background-color: #007bff;
        color: #fff;
      }

      .main {
        flex-grow: 1;
        padding: 30px;
      }

      form {
        max-width: 600px;
        margin: 0 auto;
      }

      label {
        display: block;
        margin-top: 10px;
      }

      input,
      textarea {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h3>Forms</h3>
      <div id="formNav"></div>
    </div>

    <div class="main">
      <h2 id="formTitle">Select a Form</h2>
      <div id="formContainer"></div>
    </div>

    <script>
      const token = window.location.pathname.split("/").pop();
      const nav = document.getElementById("formNav");
      const container = document.getElementById("formContainer");
      const title = document.getElementById("formTitle");

      // Map form fields to labels + renderers
      const FORM_DEFINITIONS = {
        informed_consent: {
          label: "Informed Consent",
          render: () => `
          <form>
            <p>I hereby give my informed consent to proceed with the treatment.</p>
            <label><input type="checkbox" required> I agree</label>
            <button type="submit">Submit</button>
          </form>
        `,
        },
        medical_history: {
          label: "Medical History",
          render: () => `
            <form id="medicalHistoryForm">
            <label>Do you have any allergies?</label>
            <input type="text" name="allergies" placeholder="List allergies..." required>

            <label>Current medications:</label>
            <textarea name="medications" placeholder="List medications..." required></textarea>

            <label>Past surgeries:</label>
            <textarea name="surgeries" placeholder="List past surgeries..."></textarea>

            <label>Chronic conditions:</label>
            <input type="text" name="conditions" placeholder="E.g., diabetes, asthma">

            <label>Family medical history:</label>
            <textarea name="family_history" placeholder="Any relevant family history"></textarea>

            <button type="submit">Submit</button>
            </form>
        `,
        },

        privacy_practices_notices: {
          label: "Privacy Practices Notices",
          render: () => `
          <form>
            <p>Please review our privacy policy carefully and confirm your understanding.</p>
            <label><input type="checkbox" required> I acknowledge I’ve read the privacy policy.</label>
            <button type="submit">Submit</button>
          </form>
        `,
        },
        e_sign_consent: {
          label: "E-Sign Consent",
          render: () => `
          <form>
            <p>By signing below, you consent to use electronic signatures for documents.</p>
            <label>Full Name</label>
            <input type="text" required>
            <label>Signature (type your name)</label>
            <input type="text" required>
            <button type="submit">Submit</button>
          </form>
        `,
        },
      };

      fetch(`/client/${token}`)
        .then((res) => res.json())
        .then((data) => {
          const form = data.form;
          const availableForms = Object.keys(FORM_DEFINITIONS).filter(
            (key) => form[key]
          ); // only show forms that are true

          if (!availableForms.length) {
            nav.innerHTML = "<p>No forms available.</p>";
            return;
          }

          availableForms.forEach((key) => {
            const link = document.createElement("a");
            link.textContent = FORM_DEFINITIONS[key].label;
            link.href = "#";
            link.addEventListener("click", (e) => {
              e.preventDefault();
              document
                .querySelectorAll(".sidebar a")
                .forEach((a) => a.classList.remove("active"));
              link.classList.add("active");

              title.textContent = FORM_DEFINITIONS[key].label;
              container.innerHTML = FORM_DEFINITIONS[key].render();
            });
            nav.appendChild(link);
          });

          // Auto-open first form
          nav.querySelector("a").click();
        })
        .catch((err) => {
          console.error(err);
          nav.innerHTML = "<p>Error loading forms.</p>";
        });

      container.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formEl = e.target;
        const formData = Object.fromEntries(new FormData(formEl).entries());

        const response = await fetch(`/submit-form/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            formType: title.textContent.toLowerCase().replace(/ /g, "_"),
            data: formData,
          }),
        });

        if (response.ok) {
          alert("Form submitted successfully!");
          formEl.reset();
        } else {
          alert("Error submitting form.");
        }
      });
    </script>
  </body>
</html>
